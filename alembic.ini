# Alembic configuration for Natiqo.
#
# The database URL is deliberately NOT stored here. `env.py` reads it from
# `Settings`, so migrations and the application can never disagree about which
# database they are talking to, and no password is ever committed to the repo.
#
#   alembic revision --autogenerate -m "..."   # after changing a model
#   alembic upgrade head                        # apply
#   alembic downgrade -1                        # roll back one revision
#   alembic upgrade head --sql > migration.sql  # review the DDL before applying

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
timezone = UTC

# Left blank on purpose; `env.py` supplies the real DSN from application settings.
sqlalchemy.url =

[post_write_hooks]
# `exec` rather than `console_scripts`: the console_scripts form resolves the hook
# through installed entry-point metadata, which does not include the `ruff` binary.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
