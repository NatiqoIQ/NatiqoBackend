# ------------------------------------------------------------------------------
# Natiqo backend — production stack.
#
#   cp .env.production.example .env    # then edit secrets
#   docker compose up -d --build
#
# Postgres and Redis are internal-only: neither publishes a port, so the only
# reachable surface is the API on :8000.
# ------------------------------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-natiqo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set — copy .env.production.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-natiqo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-natiqo} -d $${POSTGRES_DB:-natiqo}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Cache: evicting the least-recently-used entry under pressure is correct here —
  # every key is a cache entry that can be rebuilt from PostgreSQL.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Queue: the opposite policy. A job is not a cache entry; evicting it silently
  # deletes work a learner is waiting for (a notification, a cleanup, a settlement).
  # Separate instance also keeps a cache flush or an LRU storm away from the queue.
  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_queue:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Runs once per deploy, before any API replica. The API deliberately no longer runs
  # ``alembic upgrade head`` on boot: N replicas racing the same DDL is how a rolling
  # deploy corrupts a schema. Alembic env.py additionally takes an advisory lock, so
  # even a manual migration from a laptop cannot interleave with this job.
  migrate:
    build: .
    env_file:
      - .env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides .env on purpose. A memory queue here would accept every job and
      # deliver it to nobody, because the worker is a different process — and the only
      # symptom would be background work that silently never runs.
      QUEUE_ENABLED: "true"
      QUEUE_REDIS_URL: redis://redis-queue:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      # Named volume, not a bind mount: it inherits the image directory's
      # ownership (uid 10001) on first use, so the non-root app user can write.
      - media_data:/app/media_local

  worker:
    # The same image, a different process: it never opens a port, it only dequeues.
    # Waiting for `app` to be healthy also means waiting for `alembic upgrade head`,
    # which the API runs on boot — a worker must not start against a schema that is
    # still migrating.
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QUEUE_ENABLED: "true"
      QUEUE_REDIS_URL: redis://redis-queue:6379/0
    command: ["python", "-m", "app.workers.main"]
    depends_on:
      db:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  media_data:
  redis_queue:
