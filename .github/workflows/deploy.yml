# Deploys Natiqo to the LAN production server (192.168.69.67) via a
# self-hosted GitHub Actions runner installed on that server. The runner runs
# every step locally, so the private 192.168.69.67 address is reachable.
#
# Deploy directory on the server: /home/dev/natiqo (a git repo whose working
# tree is `reset --hard` to origin/main). The production .env lives there as an
# untracked file and survives every deploy.

# A push to main no longer deploys by itself. The workflow is triggered by the
# *completion* of CI on main, and the job below runs only when that conclusion is
# `success` — so a commit that fails lint, types, tests or coverage cannot reach the
# production server. `workflow_run` fires for failures too, hence the explicit guard:
# without it a red CI run would still start a deploy.
#
# One thing a workflow file cannot express: `main` should also require the
# `CI / quality` status check in GitHub's branch protection, so a red commit cannot be
# merged in the first place. That is repository configuration, not code.

name: Deploy to production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, natiqo]
    #: A manual run is a deliberate act by a maintainer, so it is allowed through. An
    #: automatic run must prove the tests behind it passed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Pull latest code
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          cd /home/dev/natiqo
          if [ ! -d .git ]; then git init -q; fi
          #: Remember what was running before the reset. The verify step rolls back to
          #: this commit if the new one never becomes ready; that is the difference
          #: between a failed deploy and an outage.
          git rev-parse HEAD > /tmp/natiqo-previous-sha 2>/dev/null || true
          git remote set-url origin "https://x-access-token:${PAT}@github.com/qutaibatalal/Natiqo.git"
          git fetch --prune origin main
          git reset --hard origin/main
          git remote set-url origin https://github.com/qutaibatalal/Natiqo.git

      - name: Deploy with Docker Compose
        working-directory: /home/dev/natiqo
        run: |
          set -euo pipefail
          docker compose up -d --build --remove-orphans
          docker compose ps

      - name: Verify readiness
        working-directory: /home/dev/natiqo
        run: |
          set -euo pipefail
          #: Readiness, not liveness: /health only proves the process exists. /ready
          #: checks PostgreSQL and fails on 503, which is the condition that matters to
          #: a learner holding a phone. Allow a minute for migrations and warm-up.
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" = "true" ]; then
            echo "natiqo-api is ready"
            exit 0
          fi

          echo "natiqo-api did not become ready; rolling back" >&2
          PREVIOUS=$(cat /tmp/natiqo-previous-sha 2>/dev/null || true)
          if [ -n "$PREVIOUS" ] && git cat-file -e "$PREVIOUS^{commit}" 2>/dev/null; then
            git reset --hard "$PREVIOUS"
            docker compose up -d --build --remove-orphans
            docker compose ps
          else
            echo "no previous commit recorded; leaving the stack as it is" >&2
          fi
          exit 1
