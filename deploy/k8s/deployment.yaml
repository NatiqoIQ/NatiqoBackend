# Baseline Deployment for the API.
#
# The probes are the important part. `/health` is liveness and never touches a
# dependency: restarting a pod because PostgreSQL blinked would remove healthy capacity.
# `/ready` is readiness and does touch the database, but caches its answer for two
# seconds, so a 5-second probe interval costs at most one connection per pod per window
# rather than one per probe.
#
# `maxUnavailable: 0` plus a surge of one is what makes a rolling deploy capacity-neutral:
# every old pod keeps serving until its replacement reports ready. Raise replicas before
# raising the surge; the pool size must stay inside the PgBouncer budget (see
# deploy/pgbouncer/README.ar.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: natiqo-api
  labels:
    app.kubernetes.io/name: natiqo-api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: natiqo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: natiqo-api
    spec:
      serviceAccountName: natiqo-api
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: natiqo-api
      containers:
        - name: api
          image: ghcr.io/natiqo/natiqo-backend:REPLACE_WITH_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            # Secrets are projected from the secret manager, never baked into the image
            # or written into a ConfigMap. See deploy/k8s/README.ar.md.
            - secretRef:
                name: natiqo-api-secrets
          env:
            - name: DATABASE_POOL_SIZE
              value: "10"
            - name: DATABASE_MAX_OVERFLOW
              value: "5"
            - name: WEB_CONCURRENCY
              value: "2"
            # The container runs with a read-only root filesystem; without this Python
            # tries to write __pycache__ next to the source and fails at import time.
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
            successThreshold: 1
          lifecycle:
            preStop:
              # Give the load balancer time to stop sending new requests before the
              # process starts shutting down. Without it, an in-flight answer can be cut
              # off at exactly the moment the pod is removed from the endpoints list.
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: media
              mountPath: /app/media
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: media
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: natiqo-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: natiqo-api
