# Service account for the API and worker pods.
#
# The annotation is the AWS IRSA contract: the pod's projected token is exchanged for
# temporary credentials scoped to this IAM role. Leave the placeholder until the role
# exists; an empty role is ignored by the webhook, but a wrong ARN fails every AWS call.
#
# The role needs only:
#   - secretsmanager:GetSecretValue on the one secret named by AWS_SECRET_ID (F23)
#   - s3:GetObject/PutObject/DeleteObject on the media bucket prefix
#   - nothing else: the database and Redis are reached by network credentials, not IAM.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: natiqo-api
  labels:
    app.kubernetes.io/name: natiqo-api
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::000000000000:role/natiqo-api"  # replace
automountServiceAccountToken: true
