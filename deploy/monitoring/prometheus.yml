# Minimal Prometheus configuration for Natiqo.
#
# In production this file is usually owned by the platform (managed Prometheus,
# Grafana Cloud, VictoriaMetrics). It is checked in anyway so a staging stack can be
# brought up with the same scrape contract the alerts assume.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: natiqo-api

rule_files:
  - /etc/prometheus/rules/alerts.yml

scrape_configs:
  - job_name: natiqo-api
    metrics_path: /metrics
    # One target per API replica. With Compose, add each container; with Kubernetes,
    # use the pod role below instead.
    static_configs:
      - targets:
          - app:8000

  # Uncomment when Prometheus runs inside the cluster.
  # - job_name: natiqo-api-k8s
  #   kubernetes_sd_configs:
